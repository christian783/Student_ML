<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Performance Predictor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }
        .input-group label {
            font-size: 0.875rem;
            font-weight: 600;
            color: #4a5568;
            margin-bottom: 0.5rem;
            display: block;
        }
        .input-field {
            width: 100%;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            border: 2px solid #e2e8f0;
            transition: all 0.3s;
            outline: none;
        }
        .input-field:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
        }
        .btn-primary {
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-weight: 700;
            padding: 0.75rem;
            border-radius: 8px;
            width: 100%;
            transition: transform 0.2s;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(118, 75, 162, 0.4);
        }
        .result-box {
            display: none;
            animation: fadeIn 0.5s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* Custom range slider styling */
        input[type=range] {
            -webkit-appearance: none; 
            width: 100%; 
            background: transparent; 
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 20px;
            width: 20px;
            border-radius: 50%;
            background: #667eea;
            cursor: pointer;
            margin-top: -8px; 
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #e2e8f0;
            border-radius: 2px;
        }
    </style>
</head>
<body class="flex items-center justify-center p-4">

    <div class="glass-card w-full max-w-lg p-8">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-gray-800 mb-2">🚀 Predict Your Score</h1>
            <p class="text-gray-500">AI-Powered Student Performance Analysis</p>
        </div>

        <form id="predictionForm" class="space-y-6">
            
            <!-- Study Hours -->
            <div class="input-group">
                <div class="flex justify-between">
                    <label>Study Hours (Daily)</label>
                    <span id="studyVal" class="text-blue-600 font-bold">5</span>
                </div>
                <input type="range" id="study_hours" min="1" max="10" step="1" value="5" class="w-full" oninput="document.getElementById('studyVal').innerText = this.value">
            </div>

            <!-- Sleep Hours -->
            <div class="input-group">
                <div class="flex justify-between">
                    <label>Sleep Hours (Daily)</label>
                    <span id="sleepVal" class="text-blue-600 font-bold">7</span>
                </div>
                <input type="range" id="sleep_hours" min="3" max="10" step="1" value="7" class="w-full" oninput="document.getElementById('sleepVal').innerText = this.value">
            </div>

            <!-- Previous Score -->
            <div class="input-group">
                <label>Previous Score (%)</label>
                <input type="number" id="previous_scores" class="input-field" placeholder="e.g. 85" min="0" max="100" required>
            </div>

            <!-- Sample Papers -->
            <div class="input-group">
                <label>Sample Papers Practiced</label>
                <input type="number" id="sample_papers" class="input-field" placeholder="e.g. 2" min="0" max="20" required>
            </div>

            <!-- Extracurricular -->
            <div class="flex items-center space-x-3 p-3 bg-gray-50 rounded-lg border border-gray-200">
                <input type="checkbox" id="extracurricular" class="w-5 h-5 text-blue-600 rounded focus:ring-blue-500">
                <label for="extracurricular" class="mb-0 cursor-pointer select-none">Participates in Extracurricular Activities?</label>
            </div>

            <button type="submit" id="predictBtn" class="btn-primary">
                Analyze Performance
            </button>
        </form>

        <!-- Result Display -->
        <div id="resultArea" class="result-box mt-8 p-6 bg-green-50 border border-green-200 rounded-xl text-center">
            <p class="text-gray-500 uppercase tracking-wide text-xs font-bold mb-2">Predicted Performance Index</p>
            <h2 class="text-5xl font-extrabold text-green-600 mb-2">
                <span id="scoreValue">0</span><span class="text-2xl">%</span>
            </h2>
            <p id="feedbackText" class="text-green-700 font-medium"></p>
        </div>

        <!-- Error Display -->
        <div id="errorArea" class="result-box mt-8 p-4 bg-red-50 border border-red-200 rounded-xl text-center text-red-600 font-medium" style="display: none;">
        </div>
    </div>

    <script>
        document.getElementById('predictionForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const btn = document.getElementById('predictBtn');
            const originalText = btn.innerText;
            btn.innerText = "Analyzing...";
            btn.disabled = true;
            btn.style.opacity = "0.7";

            // Hide previous results
            document.getElementById('resultArea').style.display = 'none';
            document.getElementById('errorArea').style.display = 'none';

            const data = {
                hours_studied: parseFloat(document.getElementById('study_hours').value),
                sleep_hours: parseFloat(document.getElementById('sleep_hours').value),
                previous_scores: parseFloat(document.getElementById('previous_scores').value),
                sample_papers: parseInt(document.getElementById('sample_papers').value),
                extracurricular: document.getElementById('extracurricular').checked
            };

            try {
                const response = await fetch('/predict/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (response.ok) {
                    const score = result.predicted_performance_index;
                    document.getElementById('scoreValue').innerText = score;
                    
                    // Dynamic feedback
                    let feedback = "Good start! Keep improving.";
                    if(score > 85) feedback = "Outstanding! You're on track for top grades! 🌟";
                    else if(score > 70) feedback = "Great job! A little more push and you'll excel. 🚀";
                    else if(score < 50) feedback = "You might need to focus more on studies. You can do it! 💪";
                    
                    document.getElementById('feedbackText').innerText = feedback;
                    document.getElementById('resultArea').style.display = 'block';
                } else {
                    document.getElementById('errorArea').innerText = "Error: " + (result.error || "Something went wrong");
                    document.getElementById('errorArea').style.display = 'block';
                }
            } catch (error) {
                document.getElementById('errorArea').innerText = "Network Error: Could not reach the server.";
                document.getElementById('errorArea').style.display = 'block';
            } finally {
                btn.innerText = originalText;
                btn.disabled = false;
                btn.style.opacity = "1";
            }
        });
    </script>
</body>
</html>
